<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦦 수달 vs 족제비 판별기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #cfe8ff, #d8f5e8);
    transition: background 0.6s ease;
    padding: 24px;
    color: #333;
  }
  body.otter  { background: linear-gradient(135deg, #ffd9a8, #ffb88c); }
  body.weasel { background: linear-gradient(135deg, #f0f0ff, #cfd8ff); }

  h1 { text-align: center; font-size: 2rem; margin-bottom: 6px; }
  .sub { text-align: center; color: #666; margin-bottom: 24px; }

  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }

  .card {
    background: rgba(255,255,255,0.85);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  .card h2 { font-size: 1.15rem; margin-bottom: 14px; }

  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  button, .upload-label {
    border: none; border-radius: 12px; padding: 10px 16px;
    font-size: 0.95rem; font-weight: 700; cursor: pointer;
    background: #6c8cff; color: white; transition: transform .1s;
  }
  button:hover, .upload-label:hover { transform: scale(1.04); }
  button.stop { background: #ff6b6b; }
  .upload-label { background: #4cc38a; }
  #fileInput { display: none; }

  #view {
    width: 100%; aspect-ratio: 1; border-radius: 16px;
    background: #eef2f7; display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: #999;
  }
  #view canvas, #view img { width: 100%; height: 100%; object-fit: cover; }

  .result-big { font-size: 1.8rem; font-weight: 800; text-align: center; margin: 6px 0 16px; min-height: 2.4rem; }
  .bar-row { margin-bottom: 12px; }
  .bar-label { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; }
  .bar { height: 16px; background: #e6e9ef; border-radius: 10px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: #6c8cff; transition: width .2s; border-radius: 10px; }

  .setting { margin: 14px 0; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc; }

  #log { max-height: 180px; overflow-y: auto; font-size: 0.9rem; }
  #log li { list-style: none; padding: 6px 10px; border-bottom: 1px dashed #ddd; }
  #log .empty { color: #aaa; }

  /* 팝업 */
  #popup {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #popup.show { display: flex; }
  .popup-box {
    background: white; border-radius: 24px; padding: 30px 40px; text-align: center;
    animation: pop .4s cubic-bezier(.2,1.6,.4,1);
  }
  .popup-box .emoji { font-size: 4rem; animation: wiggle 1s infinite; }
  .popup-box p { font-size: 1.3rem; font-weight: 800; margin: 10px 0 16px; }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wiggle { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
</style>
</head>
<body>

<h1>🦦 수달 vs 족제비 판별기</h1>
<p class="sub">사진을 올리거나 웹캠을 켜면 AI가 바로 판별해요!</p>

<div class="wrap">
  <!-- 왼쪽: 입력 -->
  <div class="card">
    <h2>📷 입력</h2>
    <div class="btns">
      <button id="camBtn" onclick="toggleWebcam()">웹캠 켜기</button>
      <label class="upload-label" for="fileInput">사진 업로드</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div id="view">여기에 화면이 나와요</div>
  </div>

  <!-- 오른쪽: 결과 -->
  <div class="card">
    <h2>🔍 판별 결과</h2>
    <div class="result-big" id="resultBig">모델 불러오는 중...</div>
    <div id="bars"></div>

    <div class="setting">
      🔔 알림 대상:
      <select id="alertTarget"></select>
      (80% 이상이면 팝업)
    </div>

    <h2>🕒 멸종위기종 포착 기록</h2>
    <ul id="log"><li class="empty">아직 기록이 없어요</li></ul>
  </div>
</div>

<div id="popup">
  <div class="popup-box">
    <div class="emoji" id="popupEmoji">🦦</div>
    <p id="popupText">수달 발견!</p>
    <button onclick="closePopup()">확인</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<script>
  const URL = "https://teachablemachine.withgoogle.com/models/_JTQULrgj/";
  const THRESHOLD = 0.8;          // 알림 기준 80%
  const LOG_COOLDOWN = 5000;      // 같은 동물 기록 간격(ms)

  let model, webcam, labels = [];
  let running = false;
  let lastLogTime = 0;
  let popupOpen = false, popupCooldown = false;

  // 모델 클래스 이름 → 화면에 보일 이름
  const NAME_MAP = { "class1": "족제비", "class2": "수달" };
  const rename = name => NAME_MAP[name.replace(/\s/g, "").toLowerCase()] || name;

  // 라벨 이름으로 동물 종류 구분
  const isOtter  = name => /수달|otter/i.test(name);
  const isWeasel = name => /족제비|weasel/i.test(name);
  const emojiOf  = name => isOtter(name) ? "🦦" : isWeasel(name) ? "🐾" : "❓";

  // 1. 모델 불러오기
  (async function loadModel() {
    try {
      model = await tmImage.load(URL + "model.json", URL + "metadata.json");
      labels = model.getClassLabels().map(rename);

      // 막대 그래프 + 알림 대상 셀렉트 만들기
      const bars = document.getElementById("bars");
      const select = document.getElementById("alertTarget");
      labels.forEach((name, i) => {
        bars.innerHTML += `
          <div class="bar-row">
            <div class="bar-label"><span>${emojiOf(name)} ${name}</span><span id="pct${i}">0%</span></div>
            <div class="bar"><div class="bar-fill" id="fill${i}"></div></div>
          </div>`;
        select.innerHTML += `<option value="${name}">${name}</option>`;
      });
      const otterLabel = labels.find(isOtter);
      if (otterLabel) select.value = otterLabel;

      document.getElementById("resultBig").textContent = "준비 완료! 👍";
    } catch (e) {
      document.getElementById("resultBig").textContent = "모델 로딩 실패 😢 " + e.message;
      console.error(e);
    }
  })();

  // 2. 웹캠 켜기/끄기
  async function toggleWebcam() {
    const btn = document.getElementById("camBtn");
    if (running) {
      running = false;
      webcam.stop();
      btn.textContent = "웹캠 켜기";
      btn.classList.remove("stop");
      return;
    }
    if (!model) return alert("모델이 아직 로딩 중이에요!");
    webcam = new tmImage.Webcam(400, 400, true);
    try {
      await webcam.setup();
    } catch (e) {
      return alert("웹캠 실패: " + e.message + "\n(권한 허용 or Live Server로 열기)");
    }
    await webcam.play();
    const view = document.getElementById("view");
    view.innerHTML = "";
    view.appendChild(webcam.canvas);
    running = true;
    btn.textContent = "웹캠 끄기";
    btn.classList.add("stop");
    loop();
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    await predict(webcam.canvas);
    requestAnimationFrame(loop);
  }

  // 3. 사진 업로드
  document.getElementById("fileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    if (running) toggleWebcam();
    const img = new Image();
    img.onload = () => predict(img);
    img.src = window.URL.createObjectURL(file);
    const view = document.getElementById("view");
    view.innerHTML = "";
    view.appendChild(img);
    e.target.value = "";
  });

  // 4. 판별
  async function predict(input) {
    if (!model) return;
    const pred = (await model.predict(input))
      .map(p => ({ className: rename(p.className), probability: p.probability }));

    let best = pred[0];
    pred.forEach((p, i) => {
      const pct = Math.round(p.probability * 100);
      document.getElementById("pct" + i).textContent = pct + "%";
      document.getElementById("fill" + i).style.width = pct + "%";
      if (p.probability > best.probability) best = p;
    });

    document.getElementById("resultBig").textContent =
      `${emojiOf(best.className)} ${best.className} (${Math.round(best.probability * 100)}%)`;

    // 🎨 테마 전환
    document.body.classList.remove("otter", "weasel");
    if (best.probability >= 0.6) {
      if (isOtter(best.className)) document.body.classList.add("otter");
      else if (isWeasel(best.className)) document.body.classList.add("weasel");
    }

    // 🕒 멸종위기종(수달) 포착 시각 기록
    const otter = pred.find(p => isOtter(p.className));
    if (otter && otter.probability >= THRESHOLD && Date.now() - lastLogTime > LOG_COOLDOWN) {
      lastLogTime = Date.now();
      addLog(otter);
    }

    // 🔔 알림
    const target = document.getElementById("alertTarget").value;
    const t = pred.find(p => p.className === target);
    if (t && t.probability >= THRESHOLD) showPopup(t);
  }

  function addLog(p) {
    const log = document.getElementById("log");
    const empty = log.querySelector(".empty");
    if (empty) empty.remove();
    const time = new Date().toLocaleString("ko-KR");
    const li = document.createElement("li");
    li.textContent = `🦦 ${time} — ${p.className} ${Math.round(p.probability * 100)}%`;
    log.prepend(li);
  }

  function showPopup(p) {
    if (popupOpen || popupCooldown) return;
    popupOpen = true;
    document.getElementById("popupEmoji").textContent = emojiOf(p.className);
    document.getElementById("popupText").textContent =
      `${p.className} 발견! (${Math.round(p.probability * 100)}%)`;
    document.getElementById("popup").classList.add("show");
  }

  function closePopup() {
    document.getElementById("popup").classList.remove("show");
    popupOpen = false;
    popupCooldown = true;                       // 닫자마자 또 뜨는 거 방지
    setTimeout(() => popupCooldown = false, 5000);
  }
</script>
</body>
</html>
